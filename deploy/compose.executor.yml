# Bundled executor: same product lifecycle, separate credentials and mutable state.
services:
  hermes-executor:
    image: ${FACTORY_EXECUTOR_IMAGE:?Select the executor image from this release}
    restart: unless-stopped
    labels:
      io.driftward.factory.installation: ${FACTORY_INSTALLATION_ID:?}
    env_file:
      - path: ${FACTORY_ENV_DIR:?}/executor.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/executor-identity.env
        required: true
    environment:
      DRIFTWARD_HERMES_RUNTIME_MODE: local-executor
      DRIFTWARD_HERMES_COMMAND: /opt/hermes/.venv/bin/hermes
      DRIFTWARD_HERMES_GRPC_BIND_TARGET: unix:///run/factory-executor/hermes.sock
      # A healthy bundled executor is not execution approval.
      DRIFTWARD_HERMES_CREATE_DRAFT_PR_ENABLED: "0"
    volumes:
      - factory-executor-data:/opt/data
      - factory-executor-socket:/run/factory-executor
    networks: [executor]
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: "1.0"
    mem_limit: 2g
    healthcheck:
      test: [CMD, node, -e, "const s=require('net').connect('/run/factory-executor/hermes.sock');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  bridge-executor-worker:
    depends_on:
      hermes-executor:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:?}/executor-identity.env
        required: true
    environment:
      DRIFTWARD_HERMES_GRPC_TARGET: unix:///run/factory-executor/hermes.sock
    volumes: !override
      - factory-executor-socket:/run/factory-executor:ro

volumes:
  factory-executor-data:
    name: ${FACTORY_PROJECT_NAME:?}-executor-data
    labels:
      io.driftward.factory.installation: ${FACTORY_INSTALLATION_ID:?}
  factory-executor-socket:
    name: ${FACTORY_PROJECT_NAME:?}-executor-socket
    labels:
      io.driftward.factory.installation: ${FACTORY_INSTALLATION_ID:?}
networks:
  executor:
    name: ${FACTORY_PROJECT_NAME:?}-executor
    labels:
      io.driftward.factory.installation: ${FACTORY_INSTALLATION_ID:?}
