# Same-host production migration only: layer after docker-compose.yml and
# compose.portable.yml. This does not enable execution or authorize cutover.
# Protected env files and copied state must pass the cutover preflight first.
x-production-worker-env: &production-worker-env !override
  - path: ${FACTORY_ENV_DIR:?Production environment directory is required}/hatchet-workers.env
    required: true
  - path: ${FACTORY_ENV_DIR:?}/hatchet-client.env
    required: true

services:
  postgres:
    image: ${FACTORY_POSTGRES_IMAGE:?Source Postgres image ID is required}
  hatchet-lite:
    image: ${FACTORY_HATCHET_IMAGE:?Source Hatchet image ID is required}
  bridge:
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/hatchet-bridge.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-verifier.env
        required: true
  event-ingress:
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/hatchet-workers.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-client.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-event-ingress.env
        required: true
  linear-webhook-proxy:
    profiles: !reset []
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/hatchet-event-ingress.env
        required: true
  intake-worker:
    env_file: *production-worker-env
  execution-dispatch-worker:
    env_file: *production-worker-env
  bridge-executor-worker:
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/hatchet-workers.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-client.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-worker-bridge-executor.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-verifier.env
        required: true
    environment:
      DRIFTWARD_HERMES_GRPC_TARGET: unix:///run/driftward-hermes-factory/hermes.sock
    volumes: !override
      - type: bind
        source: /run/driftward-hermes-factory
        target: /run/driftward-hermes-factory
        read_only: true
        bind:
          create_host_path: false
  pr-event-worker:
    env_file: *production-worker-env
  reconciliation-worker:
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/hatchet-workers.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-client.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-worker-reconciliation.env
        required: true
  factory-lifecycle-writer:
    profiles: !reset []
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/factory-lifecycle-writer.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-bridge.env
        required: true
  factory-linear-token-refresh:
    profiles: !reset []
    env_file: !override
      - path: ${FACTORY_ENV_DIR:?}/factory-linear-token.env
        required: true
  factory-operator:
    env_file: &production-operator-env !override
      - path: ${FACTORY_ENV_DIR:?}/factory-operator.env
        required: true
      - path: ${FACTORY_ENV_DIR:?}/hatchet-client.env
        required: true
    environment:
      HATCHET_FACTORY_OPERATOR_LIFECYCLE_DB: /var/lib/driftward-factory-lifecycle-writer/outbox.db
    depends_on:
      factory-lifecycle-writer:
        condition: service_healthy
  outbox-dispatcher:
    env_file: *production-operator-env
