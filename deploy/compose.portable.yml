# Explicit portable profile; the legacy VPS Compose defaults remain unchanged.
# Requires Docker Compose >= 2.24.4 (!override support).
x-portable: &portable
  build: !reset null
  labels: &installation-labels
    io.driftward.factory.installation: ${FACTORY_INSTALLATION_ID:?Use the portable wrapper}

services:
  postgres:
    image: ${FACTORY_IMAGE:?Use the portable wrapper}
    entrypoint: [/usr/bin/tini, --, /usr/local/bin/docker-entrypoint.sh]
    command: [postgres, -c, max_connections=100, -c, listen_addresses=*]
    environment:
      PGDATA: /var/lib/postgresql/data
      LANG: en_US.UTF-8
    labels: *installation-labels
    ports: !reset []
  hatchet-lite:
    image: ${FACTORY_IMAGE:?Use the portable wrapper}
    entrypoint: [/usr/bin/tini, --, /entrypoint.sh]
    working_dir: /
    command: []
    labels: *installation-labels
    environment:
      LITE_STATIC_ASSET_DIR: /static-assets
      LITE_FRONTEND_BASE_PATH: /
      LITE_FRONTEND_PORT: "8081"
      LITE_RUNTIME_PORT: "8888"
      DEFAULT_TENANT_ID: ${HATCHET_DEFAULT_TENANT_ID:?Initialize this installation first}
    ports: !override
      - "127.0.0.1:${FACTORY_HATCHET_PORT:-8888}:8888"
    volumes: !override
      - factory-hatchet-config-data:/config
      - ${FACTORY_INSTALL_DIR:?}/keys/hatchet:/keys:ro
  bridge:
    <<: *portable
    ports: !reset []
    volumes:
      - factory-maintenance:/run/driftward-hatchet-bridge
  event-ingress:
    <<: *portable
    ports: !reset []
  linear-webhook-proxy:
    <<: *portable
    profiles: [linear]
    ports: !override
      - "127.0.0.1:${FACTORY_WEBHOOK_PORT:-19879}:19879"
  intake-worker:
    <<: *portable
  execution-dispatch-worker:
    <<: *portable
  bridge-executor-worker:
    <<: *portable
    volumes: !reset []
  pr-event-worker:
    <<: *portable
  reconciliation-worker:
    <<: *portable
  factory-lifecycle-writer:
    <<: *portable
    profiles: [linear]
    ports: !reset []
  factory-linear-token-refresh:
    <<: *portable
    profiles: [linear]
  factory-operator:
    <<: *portable
    environment:
      # The optional Linear writer is not running; report its data unavailable.
      HATCHET_FACTORY_OPERATOR_LIFECYCLE_DB: ""
    depends_on: !override
      bridge:
        condition: service_healthy
      event-ingress:
        condition: service_healthy
    volumes: !override
      - factory-operator-socket:/run/driftward-factory-operator
      - factory-bridge-data:/var/lib/driftward-hatchet-bridge
      - factory-ingress-data:/var/lib/driftward-hatchet-event-ingress:ro
      - factory-lifecycle-data:/var/lib/driftward-factory-lifecycle-writer
      - factory-maintenance:/run/driftward-hatchet-bridge
    ports: !override
      - "127.0.0.1:${FACTORY_CONSOLE_PORT:-19881}:19881"
  outbox-dispatcher:
    <<: *portable
    volumes:
      - factory-maintenance:/run/driftward-hatchet-bridge
  factory-hermes:
    <<: *portable
    image: ${FACTORY_IMAGE:?Use the portable wrapper}
    # Started explicitly by the portable wrapper; legacy production stays unchanged.
    profiles: [hermes]
    entrypoint: [/opt/hermes/docker/entrypoint-dispatch.sh]
    command: [sleep, infinity]
    working_dir: /opt/data
    environment:
      HOME: /opt/data
      HERMES_HOME: /opt/data
      HERMES_WRITE_SAFE_ROOT: /opt/data
      HERMES_PYTHON: /opt/hermes/.venv/bin/python
      HERMES_RUNTIME_DIR: /opt/hermes/tools
      PLAYWRIGHT_BROWSERS_PATH: /opt/hermes/tools
      HERMES_WEB_DIST: /opt/hermes/hermes_cli/web_dist
      HERMES_TUI_DIR: /opt/hermes/ui-tui
      XDG_RUNTIME_DIR: /tmp/hermes-runtime
      HERMES_DASHBOARD: "0"
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PYTHONPATH: /opt/hermes
    volumes:
      - factory-hermes-data:/opt/data
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    networks: [factory]
  keygen:
    labels: *installation-labels
    image: ${FACTORY_IMAGE:?Use the portable wrapper}
    profiles: [bootstrap]
    entrypoint: [/hatchet-admin]
    command: [keyset, create-local-keys, --key-dir, /keys]
    volumes:
      - ${FACTORY_INSTALL_DIR:?}/keys/hatchet:/keys
    network_mode: none
    security_opt: [no-new-privileges:true]

volumes:
  factory-hermes-data:
    name: ${FACTORY_PROJECT_NAME:?}-hermes-data
    labels: *installation-labels
  factory-maintenance:
    name: ${FACTORY_PROJECT_NAME:?}-maintenance
    labels: *installation-labels
  factory-hatchet-postgres-data:
    labels: *installation-labels
  factory-hatchet-config-data:
    labels: *installation-labels
  factory-bridge-data:
    labels: *installation-labels
  factory-ingress-data:
    labels: *installation-labels
  factory-lifecycle-data:
    labels: *installation-labels
  factory-linear-token-data:
    labels: *installation-labels
  factory-linear-published-token:
    labels: *installation-labels
  factory-operator-socket:
    name: ${FACTORY_PROJECT_NAME:?}-operator-socket
    labels: *installation-labels

networks:
  factory:
    labels: *installation-labels
