name: ${FACTORY_PROJECT_NAME:-driftward-factory}

x-factory-image: &factory-image
  image: ${FACTORY_IMAGE:-driftward/factory:${FACTORY_IMAGE_TAG:-local}}
  build:
    context: ${FACTORY_SOURCE_ROOT:-/root/driftward/repos/factory}
    dockerfile: deploy/Dockerfile
    target: runtime
    args:
      FACTORY_RELEASE_COMMIT: ${FACTORY_RELEASE_COMMIT:-development-unversioned}
      FACTORY_RELEASE_VERSION: ${FACTORY_RELEASE_VERSION:-local}
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  networks:
    - factory

x-hatchet-client-env: &hatchet-client-env
  HATCHET_CLIENT_API_URL: ${HATCHET_CLIENT_API_URL:-http://hatchet-lite:8888}
  HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-lite:7077}
  HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-none}
  HATCHET_HERMES_BRIDGE_URL: http://bridge:19877
  HATCHET_EVENT_INGRESS_URL: http://event-ingress:19878
  HATCHET_EVENT_PUBLISHER_COMMAND: /usr/local/bin/node /app/hatchet/workers/pr-event-worker/dist/events/push-generic-event.js
  HATCHET_INTAKE_ROUTING_REGISTRY_PATH: /app/hatchet/workers/routing-registry.json
  HATCHET_VERIFIER_POLICY_PATH: /app/hatchet/workers/verifier-policy.json
  HATCHET_FACTORY_RUNTIME: docker
  DRIFTWARD_HERMES_RECEIPT_USE_SYSTEMD: "0"
  DRIFTWARD_HERMES_RECEIPT_REQUIRE_SYSTEMD: "0"

services:
  postgres:
    image: postgres:15.6@sha256:0b723c153bca6ffdc3d8084d3b4d493a945b955456bb4318c74f7a66d371a1fd
    command: postgres -c 'max_connections=100'
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HATCHET_POSTGRES_USER:-hatchet}
      POSTGRES_PASSWORD: ${HATCHET_POSTGRES_PASSWORD:?HATCHET_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${HATCHET_POSTGRES_DB:-hatchet}
    volumes:
      - factory-hatchet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${HATCHET_POSTGRES_DB:-hatchet} -U ${HATCHET_POSTGRES_USER:-hatchet}"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    cpus: "0.50"
    mem_limit: 2g
    memswap_limit: 2304m
    networks:
      - factory

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:0fc77a4779a58778abafb20d2b9077830dc0ebb984a00c8d31cc288b0b398bf6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8733:8733"
    environment:
      DATABASE_URL: "postgresql://${HATCHET_POSTGRES_USER:-hatchet}:${HATCHET_POSTGRES_PASSWORD:?HATCHET_POSTGRES_PASSWORD is required}@postgres:5432/${HATCHET_POSTGRES_DB:-hatchet}?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: ${HATCHET_SERVER_AUTH_COOKIE_DOMAIN:-srv1379035.tail410dca.ts.net}
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_COOKIE_SECRETS: ${HATCHET_SERVER_AUTH_COOKIE_SECRETS:?HATCHET_SERVER_AUTH_COOKIE_SECRETS is required}
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_ALLOW_SIGNUP: "false"
      SERVER_ALLOW_INVITES: "false"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: ${FACTORY_HATCHET_GRPC_BROADCAST_ADDRESS:-hatchet-lite:7077}
      SERVER_GRPC_PORT: "7077"
      SERVER_HEALTHCHECK: "true"
      SERVER_HEALTHCHECK_PORT: "8733"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: "localhost:7077"
      SERVER_URL: ${HATCHET_SERVER_URL:-https://srv1379035.tail410dca.ts.net:8888}
      SERVER_ENCRYPTION_MASTER_KEYSET_FILE: /keys/master.key
      SERVER_ENCRYPTION_JWT_PRIVATE_KEYSET_FILE: /keys/private_ec256.key
      SERVER_ENCRYPTION_JWT_PUBLIC_KEYSET_FILE: /keys/public_ec256.key
      ADMIN_EMAIL: ${HATCHET_ADMIN_EMAIL:-admin@driftward.local}
      ADMIN_PASSWORD: ${HATCHET_ADMIN_PASSWORD:?HATCHET_ADMIN_PASSWORD is required}
      ADMIN_NAME: ${HATCHET_ADMIN_NAME:-Driftward Admin}
      DEFAULT_TENANT_NAME: ${HATCHET_DEFAULT_TENANT_NAME:-Driftward}
      DEFAULT_TENANT_SLUG: ${HATCHET_DEFAULT_TENANT_SLUG:-driftward}
      DATABASE_LOGGER_LEVEL: "warn"
      DATABASE_LOGGER_FORMAT: "console"
      DATABASE_MAX_CONNS: ${HATCHET_DATABASE_MAX_CONNS:-20}
      DATABASE_MAX_QUEUE_CONNS: ${HATCHET_DATABASE_MAX_QUEUE_CONNS:-20}
      DATABASE_MIN_QUEUE_CONNS: ${HATCHET_DATABASE_MIN_QUEUE_CONNS:-5}
      SERVER_LOGGER_LEVEL: "info"
      SERVER_LOGGER_FORMAT: "console"
    volumes:
      - factory-hatchet-config-data:/config
      - ./keys/hatchet:/keys:ro
    cpus: "0.75"
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8733/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - factory

  bridge:
    <<: *factory-image
    command: ["python3", "-m", "hatchet_hermes_bridge.cli", "--db", "/var/lib/driftward-hatchet-bridge/bridge.db", "serve", "--host", "0.0.0.0", "--port", "19877"]
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-bridge.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-verifier.env
        required: false
    environment:
      HATCHET_VERIFIER_POLICY_PATH: /app/hatchet/workers/verifier-policy.json
      HATCHET_FACTORY_RUNTIME: docker
    volumes:
      - factory-bridge-data:/var/lib/driftward-hatchet-bridge
    ports:
      - "127.0.0.1:19877:19877"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${HATCHET_HERMES_BRIDGE_TOKEN}\" http://127.0.0.1:19877/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 192m

  event-ingress:
    <<: *factory-image
    command: ["python3", "-m", "hatchet_event_ingress.cli", "--db", "/var/lib/driftward-hatchet-event-ingress/ingress.db", "serve", "--host", "0.0.0.0", "--port", "19878"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
      bridge:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-workers.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-event-ingress.env
        required: false
    environment:
      <<: *hatchet-client-env
    volumes:
      - factory-ingress-data:/var/lib/driftward-hatchet-event-ingress
    ports:
      - "127.0.0.1:19878:19878"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19878/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.25"
    mem_limit: 192m

  linear-webhook-proxy:
    <<: *factory-image
    command: ["python3", "-m", "hatchet_event_ingress.cli", "serve-public-linear-proxy", "--host", "0.0.0.0", "--port", "19879"]
    depends_on:
      event-ingress:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-event-ingress.env
        required: false
    environment:
      HATCHET_PUBLIC_LINEAR_WEBHOOK_TARGET_URL: http://event-ingress:19878/events/linear/issue
    ports:
      - "127.0.0.1:19879:19879"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19879/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cpus: "0.10"
    mem_limit: 96m

  intake-worker:
    <<: *factory-image
    working_dir: /app/hatchet/workers/intake-worker
    command: ["node", "dist/worker.js"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
      bridge:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-workers.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
    environment:
      <<: *hatchet-client-env
    cpus: "0.25"
    mem_limit: 192m

  execution-dispatch-worker:
    <<: *factory-image
    working_dir: /app/hatchet/workers/execution-dispatch-worker
    command: ["node", "dist/worker.js"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
      bridge:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-workers.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
    environment:
      <<: *hatchet-client-env
    cpus: "0.25"
    mem_limit: 192m

  bridge-executor-worker:
    <<: *factory-image
    working_dir: /app/hatchet/workers/bridge-executor-worker
    command: ["node", "dist/worker.js"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
      bridge:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-workers.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-worker-bridge-executor.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-verifier.env
        required: false
    environment:
      <<: *hatchet-client-env
    volumes:
      - /run/driftward-hermes-factory:/run/driftward-hermes-factory
    cpus: "0.50"
    mem_limit: 256m

  pr-event-worker:
    <<: *factory-image
    working_dir: /app/hatchet/workers/pr-event-worker
    command: ["node", "dist/worker.js"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-workers.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
    environment:
      <<: *hatchet-client-env
    cpus: "0.25"
    mem_limit: 192m

  reconciliation-worker:
    <<: *factory-image
    working_dir: /app/hatchet/workers/reconciliation-worker
    command: ["node", "dist/worker.js"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
      bridge:
        condition: service_healthy
      event-ingress:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-workers.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-worker-reconciliation.env
        required: false
    environment:
      <<: *hatchet-client-env
      HATCHET_RECONCILIATION_ALLOW_DOCKER_INGRESS: "1"
    cpus: "0.25"
    mem_limit: 192m

  factory-lifecycle-writer:
    <<: *factory-image
    command: ["python3", "-m", "factory_lifecycle_writer.cli", "serve", "--interval", "30"]
    depends_on:
      bridge:
        condition: service_healthy
      event-ingress:
        condition: service_healthy
      factory-linear-token-refresh:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/factory-lifecycle-writer.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-bridge.env
        required: false
    environment:
      FACTORY_LIFECYCLE_HOST: 0.0.0.0
      FACTORY_LIFECYCLE_PORT: "19880"
      FACTORY_LIFECYCLE_DB: /var/lib/driftward-factory-lifecycle-writer/outbox.db
      FACTORY_LIFECYCLE_BRIDGE_URL: http://bridge:19877
      FACTORY_LIFECYCLE_INGRESS_URL: http://event-ingress:19878
      FACTORY_LIFECYCLE_ENV_FILE: /var/run/factory-linear-token/writer.env
    volumes:
      - factory-lifecycle-data:/var/lib/driftward-factory-lifecycle-writer
      - factory-linear-published-token:/var/run/factory-linear-token:ro
    ports:
      - "127.0.0.1:19880:19880"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19880/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "0.10"
    mem_limit: 160m

  factory-linear-token-refresh:
    <<: *factory-image
    command: ["sh", "-ec", "while true; do python3 /app/hatchet/factory-lifecycle-writer/factory-lifecycle-token-refresh; sleep \"$${FACTORY_LINEAR_TOKEN_REFRESH_INTERVAL_SECONDS:-3600}\"; done"]
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/factory-linear-token.env
        required: false
    environment:
      FACTORY_TOKEN_STATE_DIR: /var/lib/driftward-factory-linear-token
      FACTORY_LIFECYCLE_ENV_FILE: /var/run/factory-linear-token/writer.env
      FACTORY_LIFECYCLE_RESTART_SERVICE: "0"
    volumes:
      - factory-linear-token-data:/var/lib/driftward-factory-linear-token
      - factory-linear-published-token:/var/run/factory-linear-token
    cpus: "0.05"
    mem_limit: 96m
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/factory-linear-token/writer.env && test -s /var/lib/driftward-factory-linear-token/factory_actor.json && find /var/lib/driftward-factory-linear-token/factory_actor.json -mmin -120 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  factory-operator:
    <<: *factory-image
    command: ["python3", "-m", "hatchet_hermes_bridge.cli", "--db", "/var/lib/driftward-hatchet-bridge/bridge.db", "serve-operator", "--socket", "/run/driftward-factory-operator/operator.sock", "--console-host", "0.0.0.0", "--console-port", "19881"]
    depends_on:
      bridge:
        condition: service_healthy
      event-ingress:
        condition: service_healthy
      factory-lifecycle-writer:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/factory-operator.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
    environment:
      <<: *hatchet-client-env
      HATCHET_FACTORY_OPERATOR_RUNTIME: docker
      HATCHET_FACTORY_OPERATOR_BRIDGE_DB: /var/lib/driftward-hatchet-bridge/bridge.db
      HATCHET_FACTORY_OPERATOR_INGRESS_DB: /var/lib/driftward-hatchet-event-ingress/ingress.db
      HATCHET_FACTORY_OPERATOR_LIFECYCLE_DB: /var/lib/driftward-factory-lifecycle-writer/outbox.db
    volumes:
      - /run/driftward-factory-operator:/run/driftward-factory-operator
      - factory-bridge-data:/var/lib/driftward-hatchet-bridge
      - factory-ingress-data:/var/lib/driftward-hatchet-event-ingress:ro
      - factory-lifecycle-data:/var/lib/driftward-factory-lifecycle-writer
    ports:
      - "127.0.0.1:19881:19881"
    cpus: "0.10"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/driftward-factory-operator/operator.sock && curl -fsS http://127.0.0.1:19881/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  outbox-dispatcher:
    <<: *factory-image
    command: ["sh", "-ec", "while true; do python3 -m hatchet_hermes_bridge.cli --db /var/lib/driftward-hatchet-bridge/bridge.db dispatch-factory-outbox --limit 50; python3 -m hatchet_event_ingress.cli --db /var/lib/driftward-hatchet-event-ingress/ingress.db dispatch-pending --limit 50; date +%s > /tmp/factory-outbox-last-success; sleep \"$${FACTORY_OUTBOX_DISPATCH_INTERVAL_SECONDS:-30}\"; done"]
    depends_on:
      hatchet-lite:
        condition: service_healthy
      bridge:
        condition: service_healthy
      event-ingress:
        condition: service_healthy
    env_file:
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/factory-operator.env
        required: false
      - path: ${FACTORY_ENV_DIR:-/etc/driftward}/hatchet-client.env
        required: false
    environment:
      <<: *hatchet-client-env
      DRIFTWARD_BRIDGE_RELEASE_ROOT: /app
    volumes:
      - factory-bridge-data:/var/lib/driftward-hatchet-bridge
      - factory-ingress-data:/var/lib/driftward-hatchet-event-ingress
    cpus: "0.10"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/factory-outbox-last-success && find /tmp/factory-outbox-last-success -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  factory-hatchet-postgres-data:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-hatchet-postgres-data
  factory-hatchet-config-data:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-hatchet-config-data
  factory-bridge-data:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-bridge-data
  factory-ingress-data:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-ingress-data
  factory-lifecycle-data:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-lifecycle-data
  factory-linear-token-data:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-linear-token-data

  factory-linear-published-token:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}-linear-published-token

networks:
  factory:
    name: ${FACTORY_PROJECT_NAME:-driftward-factory}
