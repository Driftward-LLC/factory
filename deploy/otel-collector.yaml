receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 64
    spike_limit_mib: 16
  batch:
    timeout: 1s
    send_batch_size: 32
    send_batch_max_size: 64

exporters:
  otlp_http/posthog:
    # Application spans belong in Distributed Tracing, NOT /i/v0/ai/otel.
    traces_endpoint: ${env:POSTHOG_TRACES_ENDPOINT}
    headers:
      Authorization: Bearer ${env:POSTHOG_PROJECT_TOKEN}
    timeout: 5s
    sending_queue:
      queue_size: 256
    retry_on_failure:
      max_elapsed_time: 30s

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/posthog]
