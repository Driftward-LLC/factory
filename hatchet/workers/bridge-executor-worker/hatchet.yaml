dev:
  preCmds:
    - "npm install --prefix .."
    - "npm run build -w @factory/hatchet-worker-shared"
  runCmd: "npm start"
  files:
    - "src/**/*.ts"
    - "../shared/src/**/*.ts"
    - "!**/node_modules/**"
  reload: true

triggers:
  - name: accepted
    description: "Push a factory.hermes.job.accepted event for an existing bridge job"
    command: "npm run push:accepted"
