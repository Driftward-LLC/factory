dev:
  preCmds:
    - "npm install --prefix .."
    - "npm run build -w @driftward/hatchet-worker-shared"
  runCmd: "npm start"
  files:
    - "src/**/*.ts"
    - "../shared/src/**/*.ts"
    - "!**/node_modules/**"
  reload: true

triggers:
  - name: bridge-check
    description: "Inspect recent bridge ledger jobs and emit reconciliation findings"
    command: "npm run trigger:bridge-check"
