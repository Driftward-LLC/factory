dev:
  preCmds:
    - "npm install --prefix .."
    - "npm run build -w @driftward/hatchet-worker-shared"
  runCmd: "npm start"
  files:
    - "src/**/*.ts"
    - "../shared/src/**/*.ts"
    - "!**/node_modules/**"
  reload: true

triggers:
  - name: dry-run
    description: "Submit a dry-run create_draft_pr job to the bridge"
    command: "npm run trigger:dry-run"
