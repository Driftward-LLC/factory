name: Factory Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create, such as v2026.9.2 or v2026.9.2.1
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean
      dry_run:
        description: Validate only; do not push an image or create a tag or GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: factory-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate And Release
    if: github.repository == 'Driftward-LLC/factory' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      IMAGE_REPOSITORY: ghcr.io/driftward-llc/factory
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hatchet/workers/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hatchet/bridge/requirements.txt

      - name: Install bridge dependencies
        run: python3 -m pip install --requirement hatchet/bridge/requirements.txt

      - name: Require successful quality checks for the exact release commit
        run: python3 deploy/auto_deploy_artifact.py --check-release-quality

      - name: Verify public release package
        if: env.DRY_RUN != 'true'
        run: python3 deploy/auto_deploy_artifact.py --verify-public-package

      - name: Validate release request
        run: |
          set -euo pipefail
          git fetch --tags origin
          release_sha="$(git rev-parse HEAD)"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$ ]]; then
            echo "release_tag must match vYYYY.M.D or vYYYY.M.D.N" >&2
            exit 64
          fi
          tag_commit="$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" || true)"
          if [[ -n "$tag_commit" ]]; then
            if [[ "$tag_commit" != "$release_sha" ]]; then
              echo "release tag already exists at a different commit: $RELEASE_TAG" >&2
              exit 64
            fi
            if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
              echo "release tag already exists but is not annotated: $RELEASE_TAG" >&2
              exit 64
            fi
            echo "release tag already exists at the target commit; release creation will reuse it"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $RELEASE_TAG" >&2
            exit 64
          fi
          git status --short

      - name: Install worker dependencies
        run: npm ci --prefix hatchet/workers

      - name: Build React console
        run: |
          npm ci --prefix factory/console
          npm run build --prefix factory/console

      - name: Generate and check contracts
        run: |
          python3 tools/hatchet-contracts.py generate
          python3 tools/hatchet-contracts.py check
          git diff --exit-code -- hatchet/event-ingress/hatchet_event_ingress/contracts.py hatchet/workers/shared/src/contracts.ts

      - name: Build shared component catalog
        run: |
          npm run check:ui --prefix factory/console
          npm run build-storybook --prefix factory/console

      - name: Run tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build and test workers
        run: |
          npm run build --prefix hatchet/workers
          npm run test --prefix hatchet/workers/intake-worker
          npm run test --prefix hatchet/workers/bridge-executor-worker
          npm run test --prefix hatchet/workers/reconciliation-worker

      - name: Test bridge, ingress, and lifecycle writer
        run: |
          PYTHONPATH=hatchet/bridge:hatchet/factory-lifecycle-writer python3 -m unittest discover -s hatchet/bridge/tests
          PYTHONPATH=hatchet/event-ingress python3 -m unittest discover -s hatchet/event-ingress/tests
          PYTHONPATH=hatchet/bridge:hatchet/factory-lifecycle-writer python3 -m unittest discover -s hatchet/factory-lifecycle-writer/tests

      - name: Validate Docker deployment
        run: |
          HATCHET_POSTGRES_PASSWORD=ci-postgres-password \
            HATCHET_SERVER_AUTH_COOKIE_SECRETS=ci-cookie-secret \
            HATCHET_ADMIN_PASSWORD=ci-admin-password \
            FACTORY_SOURCE_ROOT="$PWD" \
            docker compose -f deploy/docker-compose.yml config >/dev/null
          docker build --platform linux/amd64 \
            --build-arg FACTORY_RELEASE_COMMIT="$(git rev-parse HEAD)" \
            --build-arg FACTORY_RELEASE_VERSION="$RELEASE_TAG" \
            -f deploy/Dockerfile -t driftward/factory:ci .

      - name: Prove disposable portable installation and restore
        run: |
          python3 tools/check_factory_portable.py --image driftward/factory:ci --telemetry

      - name: Rehearse stopped production-state relocation
        run: python3 tools/check_factory_cutover.py --image driftward/factory:ci

      - name: Check changed-file whitespace
        run: git diff --check HEAD

      - name: Ensure checkout remains clean
        run: |
          set -euo pipefail
          if [[ -n "$(git status --short)" ]]; then
            git status --short
            exit 1
          fi

      - name: Scan committed content for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .

      - name: Validate portable release packaging
        run: |
          set -euo pipefail
          # A local image ID is not a registry manifest digest. Never publish this preview.
          local_image_id="$(docker image inspect driftward/factory:ci --format '{{.Id}}')"
          bash deploy/package-release.sh --version "$RELEASE_TAG" \
            --image "$IMAGE_REPOSITORY@$local_image_id" \
            --source-commit "$(git rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/factory-release-preview" --validation-only
          (cd "$RUNNER_TEMP/factory-release-preview" && sha256sum --check SHA256SUMS)

      - name: Publish validated runtime image
        id: image
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          image_tag="$IMAGE_REPOSITORY:$RELEASE_TAG"
          if docker manifest inspect "$image_tag" >/dev/null 2>&1; then
            echo "image tag already exists; refusing to overwrite: $image_tag" >&2
            exit 64
          fi
          docker tag driftward/factory:ci "$image_tag"
          docker push --platform linux/amd64 "$image_tag"
          # A platform-only push can leave the unpublished parent index in local RepoDigests.
          image_digest="$(docker manifest inspect --verbose "$image_tag" | jq -er '.Descriptor.digest')"
          image_ref="$IMAGE_REPOSITORY@$image_digest"
          [[ "$image_ref" =~ ^ghcr\.io/driftward-llc/factory@sha256:[a-f0-9]{64}$ ]]
          python3 deploy/auto_deploy_artifact.py --release "$RUNNER_TEMP/factory-release" \
            driftward/factory:ci "$RELEASE_TAG" "$image_ref"
          echo "reference=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Package digest-pinned portable release
        if: env.DRY_RUN != 'true'
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          bash deploy/package-release.sh --version "$RELEASE_TAG" \
            --image "$PUBLISHED_IMAGE" --source-commit "$(git rev-parse HEAD)" \
            --output-dir "$RUNNER_TEMP/factory-release"
          (cd "$RUNNER_TEMP/factory-release" && sha256sum deployment.json >> SHA256SUMS && sha256sum --check SHA256SUMS)

      - name: Write release notes
        env:
          PUBLISHED_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/factory-release-notes.md" <<EOF
          Factory $RELEASE_TAG

          Source: $release_sha
          Platform: Linux amd64
          Runtime image: ${PUBLISHED_IMAGE:-validation-only; no image published}

          Validation performed by this workflow:
          - Generated and checked Hatchet contracts.
          - Ran repository tool tests.
          - Built and tested Hatchet workers.
          - Ran bridge, ingress, and lifecycle writer tests.
          - Validated Docker Compose config and built the Factory image.
          - Validated the allowlisted portable release bundle and its checksum.
          - Checked whitespace and scanned committed content with gitleaks.

          Deployment:
          Installations select and pull this release independently.
          Download the portable archive, deployment.json and SHA256SUMS, verify the checksums, then
          follow deploy/PORTABLE.md inside the archive. The included factory.env
          pins the runtime image by digest. No source checkout is required.
          Docker Engine with Compose and Python 3 are host prerequisites.
          The public image can be pulled without registry credentials.
          Existing managed installations can preview this exact release with:
          factory deploy preview --release $RELEASE_TAG

          \`\`\`bash
          sha256sum --check SHA256SUMS
          tar -xzf factory-$RELEASE_TAG-linux-amd64.tar.gz
          cd factory-$RELEASE_TAG-linux-amd64
          python3 deploy/factory-portable.py --help
          \`\`\`
          EOF

      - name: Attest the release assets
        if: env.DRY_RUN != 'true'
        uses: actions/attest@v4
        with:
          subject-path: '${{ runner.temp }}/factory-release/*'

      - name: Create tag and GitHub release
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "using existing annotated tag: $RELEASE_TAG"
          else
            git tag -a "$RELEASE_TAG" -m "Factory $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          args=(release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Factory $RELEASE_TAG" --notes-file "$RUNNER_TEMP/factory-release-notes.md" --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          args+=("$RUNNER_TEMP/factory-release/factory-$RELEASE_TAG-linux-amd64.tar.gz" "$RUNNER_TEMP/factory-release/SHA256SUMS" "$RUNNER_TEMP/factory-release/deployment.json")
          gh "${args[@]}"

      - name: Report dry run
        if: env.DRY_RUN == 'true'
        run: |
          echo "Dry run complete. No image was pushed and no tag or GitHub release was created."
          echo "The validation-only preview is not installable and was not uploaded."
