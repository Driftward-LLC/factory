name: Hatchet Quality

on:
  pull_request:
    paths:
      - 'factory/**'
      - 'hatchet/**'
      - 'deploy/**'
      - 'tools/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.dockerignore'
      - '.github/workflows/factory-release.yml'
      - '.github/workflows/hatchet-quality.yml'
      - '.github/workflows/factory-deploy.yml'
  push:
    branches: [main]
    # Deployment accepts only the current main SHA. A path-filtered push could
    # supersede a tested runtime change without producing its own deployable run.

permissions:
  contents: read

jobs:
  console-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real-console test dependencies
        run: python3 -m pip install --requirement hatchet/bridge/requirements.txt
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/factory-console-checks" --no-save --ignore-scripts playwright@1.55.0
          node "$RUNNER_TEMP/factory-console-checks/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: Build React console
        run: |
          npm ci --prefix factory/console
          npm run build --prefix factory/console
      - name: Check console behavior with disposable fixtures
        run: NODE_PATH="$RUNNER_TEMP/factory-console-checks/node_modules" node tools/test_factory_console_browser.cjs
      - name: Check issue ownership controls with disposable fixtures
        run: NODE_PATH="$RUNNER_TEMP/factory-console-checks/node_modules" node tools/test_factory_issue_control_browser.cjs
      - name: Check issue ownership through the real console backend
        run: NODE_PATH="$RUNNER_TEMP/factory-console-checks/node_modules" node tools/test_factory_issue_control_backend_browser.cjs
      - name: Build and check shared component catalog
        run: |
          npm run check:ui --prefix factory/console
          node tools/test_factory_ui_package.cjs
          npm run build-storybook --prefix factory/console
          NODE_PATH="$RUNNER_TEMP/factory-console-checks/node_modules" node tools/test_factory_storybook.cjs
      - name: Upload shared component catalog
        uses: actions/upload-artifact@v4
        with:
          name: driftward-ui-storybook
          path: factory/console/storybook-static/
          include-hidden-files: true
      - name: Upload fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-console-fixtures
          path: |
            /tmp/factory-dashboard-*.png
            /tmp/factory-control-*.png
            /tmp/factory-storybook-*.png
          if-no-files-found: ignore
  validate:
    permissions:
      contents: read
      # Permissions are static per job; trusted same-repo PR jobs have this
      # capability, but only main pushes can run the publisher. Forks are read-only.
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hatchet/workers/package-lock.json
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: hatchet/bridge/requirements.txt
      - name: Install bridge dependencies
        run: python3 -m pip install --requirement hatchet/bridge/requirements.txt
      - name: Install worker dependencies
        run: npm ci --prefix hatchet/workers
      - name: Build React console
        run: |
          npm ci --prefix factory/console
          npm run build --prefix factory/console
      - name: Generate and check contracts
        run: |
          python3 tools/hatchet-contracts.py generate
          python3 tools/hatchet-contracts.py check
          git diff --exit-code -- hatchet/event-ingress/hatchet_event_ingress/contracts.py hatchet/workers/shared/src/contracts.ts
      - name: Run tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check root-only CLI transport with disposable Unix sockets
        run: sudo -- "${{ steps.python.outputs.python-path }}" -m unittest tools.test_factory_cli.CanonicalCliTests.test_operator_round_trip_uses_private_parsed_credentials_and_cleans_up tools.test_factory_operator_cli
      - name: Build and test workers
        run: |
          npm run build --prefix hatchet/workers
          npm run test --prefix hatchet/workers/intake-worker
          npm run test --prefix hatchet/workers/bridge-executor-worker
          npm run test --prefix hatchet/workers/reconciliation-worker
      - name: Test bridge, ingress, and lifecycle writer
        run: |
          PYTHONPATH=hatchet/bridge:hatchet/factory-lifecycle-writer python3 -m unittest discover -s hatchet/bridge/tests
          PYTHONPATH=hatchet/event-ingress python3 -m unittest discover -s hatchet/event-ingress/tests
          PYTHONPATH=hatchet/bridge:hatchet/factory-lifecycle-writer python3 -m unittest discover -s hatchet/factory-lifecycle-writer/tests
      - name: Validate Docker deployment
        run: |
          HATCHET_POSTGRES_PASSWORD=ci-postgres-password \
            HATCHET_SERVER_AUTH_COOKIE_SECRETS=ci-cookie-secret \
            HATCHET_ADMIN_PASSWORD=ci-admin-password \
            FACTORY_SOURCE_ROOT="$PWD" \
            docker compose -f deploy/docker-compose.yml config >/dev/null
          docker build \
            --build-arg FACTORY_RELEASE_COMMIT="$(git rev-parse HEAD)" \
            --build-arg FACTORY_RELEASE_VERSION=ci \
            -f deploy/Dockerfile -t driftward/factory:ci .
      - name: Prove isolated fresh install, restart, and restore
        run: |
          docker pull "$(PYTHONPATH=deploy python3 -c 'import telemetry; print(telemetry.IMAGE)')"
          python3 tools/check_factory_portable.py --image driftward/factory:ci --telemetry
      - name: Rehearse stopped production-state relocation
        run: python3 tools/check_factory_cutover.py --image driftward/factory:ci
      - name: Check changed-file whitespace
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$base" HEAD
      - name: Scan committed content for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - name: Verify production package read-only for internal pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'Driftward-LLC/factory' && github.repository == 'Driftward-LLC/factory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/auto_deploy_artifact.py --verify-package
      - name: Authenticate private production image publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Driftward-LLC/factory'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Publish the tested production image and package metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Driftward-LLC/factory'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/auto_deploy_artifact.py "$RUNNER_TEMP/factory-production" driftward/factory:ci
      - name: Retain immutable production image metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: factory-production-${{ github.sha }}
          path: ${{ runner.temp }}/factory-production/
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
          overwrite: true
