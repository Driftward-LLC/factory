name: Factory Deploy

on:
  workflow_run:
    workflows: [Hatchet Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.FACTORY_AUTO_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No checkout, downloaded script, remote shell or production runner.
      - name: Request deployment of the successful main revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_HOST: ${{ vars.FACTORY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.FACTORY_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.FACTORY_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.FACTORY_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$COMMIT" ]]; then
            echo 'Superseded by newer main; no deployment requested.'
            exit 0
          fi
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -f "$key_dir/key" "$key_dir/known_hosts"; rmdir "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh -T -i "$key_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RUN_ID $COMMIT"
